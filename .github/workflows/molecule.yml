name: Ansible Molecule

on:
  pull_request:  # test workflow before merging it

jobs:
  molecule:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Ansible Molecule
        uses: ./.github/actions/setup-molecule

      - name: Run default Molecule scenario
        run: echo molecule --base-config molecule/base.yml test --scenario-name default

      - name: Run gbdbdir Molecule scenario
        run: echo molecule --base-config molecule/base.yml test --scenario-name gbdbdir
