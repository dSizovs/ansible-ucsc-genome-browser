---
- name: Ensure genome assemblies to update are listed
  ansible.builtin.assert:
    that:
      - ucsc_genome_browser_assemblies_update_assemblies is not string
      - ucsc_genome_browser_assemblies_update_assemblies | length > 0
    fail_msg: "Set `ucsc_genome_browser_assemblies_update_assemblies` to a non-empty list of assemblies to enable genome assembly updates."
  when: ucsc_genome_browser_assemblies_update_enabled

- name: Install UCSC Genome Browser genome assembly update units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/ucsc-genome-browser-{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - assembly-updater.service
    - assembly-updater.timer

- name: Enable UCSC Genome Browser genome assembly update timer
  ansible.builtin.systemd_service:
    name: ucsc-genome-browser-assembly-updater.timer
    enabled: "{{ ucsc_genome_browser_assemblies_update_enabled }}"
    state: "{{ 'started' if ucsc_genome_browser_assemblies_update_enabled else 'stopped' }}"
    daemon_reload: true
