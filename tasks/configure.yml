---
- name: Apply UCSC Genome Browser hg.conf settings
  community.general.ini_file:
    path: "{{ ucsc_genome_browser_setting_CGIBINDIR }}/hg.conf"
    section: null  # hg.conf is a flat key=value file with no sections
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    state: present
  loop: "{{ ucsc_genome_browser_hg_conf_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Serve the UCSC Genome Browser API also via short URLs
  ansible.builtin.blockinfile:
    path: /etc/httpd/conf.d/001-browser.conf  # created by installation script
    marker: "# {mark} ANSIBLE MANAGED BLOCK: UCSC Genome Browser API short URLs"
    insertbefore: "^</VirtualHost>"
    block: "{{ lookup('ansible.builtin.template', 'hubApi.conf.j2') }}"
    state: "{{ 'present' if ucsc_genome_browser_api_short_urls_enabled else 'absent' }}"
  notify: Reload Apache
