---
- name: Check if UCSC Genome Browser is already installed
  ansible.builtin.stat:
    path: "/usr/local/apache/cgiInstallComplete.flag"
  register: ucsc_genome_browser_installation_flag

- name: Set fact indicating whether UCSC Genome Browser is already installed
  ansible.builtin.set_fact:
    ucsc_genome_browser_installed: "{{ ucsc_genome_browser_installation_flag.stat.exists }}"

- name: Install UCSC Genome Browser
  when: not ucsc_genome_browser_installed
  block:
    - name: Set path for UCSC Genome browser installation log
      ansible.builtin.set_fact:
        ucsc_genome_browser_installation_log: "{{ ucsc_genome_browser_tmpdir.path }}/ucsc_install.log"  # cleaned up after installation

    - name: Pre-create UCSC Genome Browser installation log
      ansible.builtin.copy:
        content: ""
        dest: "{{ ucsc_genome_browser_installation_log }}"
        mode: "0600"
      changed_when: false

    - name: Install UCSC Genome Browser
      ansible.builtin.shell:
        cmd: "bash {{ ucsc_genome_browser_install_script }} -b install >> {{ ucsc_genome_browser_installation_log }} 2>&1"
      async: 86400
      poll: 0
      register: ucsc_genome_browser_installation_job

    - name: Stream UCSC Genome Browser installation log
      stream_file:
        file: "{{ ucsc_genome_browser_installation_log }}"
        job_id: "{{ ucsc_genome_browser_installation_job.ansible_job_id }}"

    - name: Get UCSC Genome Browser installation result
      ansible.builtin.async_status:
        jid: "{{ ucsc_genome_browser_installation_job.ansible_job_id }}"
      register: ucsc_genome_browser_installation_result
      changed_when: false

    - name: Bubble up error if UCSC Genome Browser installation failed
      ansible.builtin.fail:
          msg: "UCSC Genome Browser installation failed."
      when: ucsc_genome_browser_installation_result.rc != 0

- name: Check if offline mode is active
  ansible.builtin.shell:
    cmd: "grep -q '^#slow-db\\.' {{ ucsc_genome_browser_setting_APACHEDIR }}/cgi-bin/hg.conf"
    # rc=0 if offline mode is active, rc=1 if offline mode is NOT active
  register: ucsc_genome_browser_offline_mode_check
  failed_when: false
  changed_when: false

- name: Enable offline mode
  when: ucsc_genome_browser_offline_mode
  ansible.builtin.shell:
    cmd: "bash {{ ucsc_genome_browser_install_script }} -b offline"
  changed_when: ucsc_genome_browser_offline_mode_check.rc != 0

- name: Enable on-the-fly mode
  when: not ucsc_genome_browser_offline_mode
  ansible.builtin.shell:
    cmd: "bash {{ ucsc_genome_browser_install_script }} -b online"
  changed_when: ucsc_genome_browser_offline_mode_check.rc == 0

- name: Work around `GBDBDIR` setting being ignored by the installation script
  vars:
    ucsc_genome_browser_gbdb_dir: "/gbdb/"
  block:
    - name: Convert configured UCSC Genome Browser genomics database directory to absolute path
      # also resolves it if defined as a shell expression, e.g. in terms of another variable
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: 'realpath --no-symlinks "$(echo {{ ucsc_genome_browser_setting_GBDBDIR | default(ucsc_genome_browser_gbdb_dir) }})"'
      changed_when: false
      register: ucsc_genome_browser_gbdb_dir_setting_resolved_absolute

    - name: Check if hardcoded UCSC Genome Browser genomics database directory exists
      ansible.builtin.stat:
        path: "{{ ucsc_genome_browser_gbdb_dir }}"
      register: ucsc_genome_browser_gbdb_dir_stat

    - name: Ensure UCSC Genome Browser can access the genomics database
      ansible.builtin.file:
        src: "{{ ucsc_genome_browser_setting_GBDBDIR }}"
        dest: "{{ ucsc_genome_browser_gbdb_dir }}"
        state: link
        owner: root
        group: root
        force: true
        # if `/gbdb/` already exists and is a directory, the task will fail,
        # despite `force: true`; that's probably a good idea, since it likely
        # means there is already a genomics database in `/gbdb/`, and
        # re-downloading this data is expensive
      when:
        # the resolved absolute path of the configured genomics database directory is not equal to the hardcoded path
        - "ucsc_genome_browser_gbdb_dir_setting_resolved_absolute.stdout != ucsc_genome_browser_gbdb_dir.rstrip('/')"
